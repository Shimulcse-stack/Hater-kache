<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <rect width="128" height="128" rx="28" fill="#061224"/>
  
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cloud Background Outline -->
    <path d="M42 58 C34 58 28 52 28 44 C28 36.5 33.5 30.5 40.5 30 C44 20 54 13 65.5 13 C77.5 13 87.5 20.5 90.5 31 C97 32 102 37.5 102 44.5 C102 52 96 58 88 58" />
    
    <!-- Laptop Screen -->
    <rect x="42" y="32" width="44" height="28" rx="3" fill="#061224" stroke="#ffffff" stroke-width="3.5"/>
    
    <!-- Laptop Screen Internal Icons (Cloud, Doc, Tree) -->
    <!-- Small Cloud -->
    <path d="M49 45 C47.5 45 46.5 44 46.5 42.5 C46.5 41 47.5 40 49 40 C49.5 38 51.5 37 53 38 C54.5 38 55.5 39 55.5 40.5 C56.5 40.5 57 41.5 57 42.5 C57 44 56 45 54.5 45 Z" fill="#ffffff" stroke="none"/>
    <!-- Small Doc -->
    <rect x="60" y="37" width="8" height="10" rx="1" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="62.5" y1="41" x2="65.5" y2="41" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="62.5" y1="44" x2="65.5" y2="44" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Small Network/Tree -->
    <circle cx="76" cy="39" r="1.5" fill="#ffffff" stroke="none"/>
    <circle cx="73" cy="45" r="1.5" fill="#ffffff" stroke="none"/>
    <circle cx="79" cy="45" r="1.5" fill="#ffffff" stroke="none"/>
    <path d="M76 40.5 L76 42.5 M76 42.5 L73 43.5 M76 42.5 L79 43.5" stroke="#ffffff" stroke-width="1.3"/>
    
    <!-- Laptop Base / Keyboard -->
    <path d="M36 60 L92 60 L87 67 L41 67 Z" fill="#061224" stroke="#ffffff" stroke-width="3.5" />
    <line x1="58" y1="63.5" x2="70" y2="63.5" stroke="#ffffff" stroke-width="2.5" />

    <!-- Document Stack Layer 1 (Top) -->
    <path d="M64 74 L94 85 L64 96 L34 85 Z" fill="#061224" stroke="#ffffff" stroke-width="3.5"/>
    
    <!-- Text Lines on Top Doc -->
    <line x1="52" y1="81" x2="76" y2="89" stroke="#ffffff" stroke-width="2.2" />
    <line x1="48" y1="85" x2="72" y2="93" stroke="#ffffff" stroke-width="2.2" />
    <line x1="54" y1="89" x2="68" y2="94" stroke="#ffffff" stroke-width="2.2" />

    <!-- Document Stack Layer 2 (Middle) -->
    <path d="M34 91 L64 102 L94 91" fill="none" stroke="#ffffff" stroke-width="3.5"/>

    <!-- Document Stack Layer 3 (Bottom) -->
    <path d="M34 97 L64 108 L94 97" fill="none" stroke="#ffffff" stroke-width="3.5"/>

    <!-- Document Stack Base (Bottom-most rim) -->
    <path d="M34 103 L64 114 L94 103" fill="none" stroke="#ffffff" stroke-width="3.5"/>
